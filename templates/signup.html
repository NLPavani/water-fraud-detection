<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up | Water Fraud Detection</title>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;

            background: url("/static/images/water_bg.jpg") no-repeat center center/cover;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.92);
            padding: 35px;
            border-radius: 16px;
            width: 340px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);

            text-align: center;
        }

        h2 {
            color: #0077b6;
            margin-bottom: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #0077b6;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(135deg, #0077b6, #00b4d8);
            color: white;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 15px;
            font-size: 13px;
        }

        .login-link a {
            color: #0077b6;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <h2>📝 Create Account</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <p style="color:red;">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Choose Password" required>

            <button type="submit">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Login</a>
        </div>

    </div>

</body>

</html>
